<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>V32 Fixed - Absolute Base</title>
    <style>
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #000; margin: 0; overflow: hidden; font-family: sans-serif; touch-action: none; color: #fff; }
        #game-area {
            position: relative; width: 100%; max-width: 600px; height: 100vh;
            margin: 0 auto; background: #030305; border-left: 2px solid #333; border-right: 2px solid #333;
        }
        .judge-rail {
            position: absolute; width: 100%; height: 2px;
            background: #0ff; box-shadow: 0 0 10px #0ff; z-index: 10;
        }
        #rail-top { bottom: 162px; opacity: 0.6; } 
        #rail-bottom { bottom: 138px; opacity: 0.6; } 

        .note {
            position: absolute; width: calc(25% - 6px); height: 24px;
            background: #fff; border-radius: 2px; display: none; z-index: 5;
            will-change: transform;
        }
        #ui { position: absolute; top: 15%; width: 100%; text-align: center; pointer-events: none; z-index: 20; }
        #judge-text { font-size: 3.5rem; font-weight: 900; height: 4.5rem; }
        #combo { font-size: 4rem; font-weight: bold; }
        #controls {
            position: absolute; top: 10px; left: 10px; z-index: 30;
            background: rgba(0,0,0,0.8); padding: 12px; border-radius: 8px; font-size: 14px; border: 1px solid #444;
        }
        .input-box { background: #222; color: #fff; border: 1px solid #666; width: 55px; padding: 4px; text-align: center; }
        .control-row { margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="ui">
    <div id="judge-text">START</div>
    <div id="combo">0</div>
</div>

<div id="controls">
    <div class="control-row">BPM: <input type="number" id="inp-bpm" class="input-box" value="120"></div>
    <div class="control-row">密度: <input type="number" id="inp-den" class="input-box" value="1" min="1" max="4"></div>
    <div class="control-row">OFF: <input type="number" id="inp-off" class="input-box" value="120">ms</div>
    <div style="font-size:10px; color:#0ff; margin-top:5px;">PERFECT: ±33.3ms</div>
</div>

<div id="game-area">
    <div class="judge-rail" id="rail-top"></div>
    <div class="judge-rail" id="rail-bottom"></div>
    <div id="notes-container"></div>
</div>

<script>
    const container = document.getElementById('notes-container');
    const comboEl = document.getElementById('combo');
    const judgeEl = document.getElementById('judge-text');
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // デフォルトオフセットを120に固定
    let config = { bpm: 120, offset: 120, speed: 11, density: 1 };
    
    document.getElementById('inp-bpm').onchange = (e) => { config.bpm = Math.max(1, parseInt(e.target.value)); };
    document.getElementById('inp-den').onchange = (e) => { config.density = Math.max(1, Math.min(4, parseInt(e.target.value))); };
    document.getElementById('inp-off').onchange = (e) => { config.offset = parseInt(e.target.value); };

    let isPlaying = false, notes = [], combo = 0, lastBeatTime = 0, beatCount = 0;

    for (let i = 0; i < 200; i++) {
        const div = document.createElement('div');
        div.className = 'note';
        container.appendChild(div);
        notes.push({ el: div, y: -50, lane: 0, active: false, targetTime: 0 });
    }

    function playTick(isDownBeat) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(isDownBeat ? 1200 : 800, audioCtx.currentTime);
        osc.type = 'sine';
        gain.gain.setValueAtTime(isDownBeat ? 0.12 : 0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
        osc.start(); osc.stop(audioCtx.currentTime + 0.04);
    }

    function startGame() {
        if (isPlaying) return;
        audioCtx.resume();
        isPlaying = true;
        // スタート時に確実にテキストを消す
        judgeEl.innerText = "";
        judgeEl.style.color = "#fff";
        lastBeatTime = performance.now();
        beatCount = 0;
        update();
    }

    function update() {
        if (!isPlaying) return;
        const now = performance.now();
        const beatInterval = 60000 / config.bpm;
        const spawnInterval = beatInterval / 2;

        if (now - lastBeatTime > spawnInterval) {
            if (beatCount % 2 === 0) {
                const isDownBeat = (beatCount / 2) % 4 === 0;
                playTick(isDownBeat);
            }
            spawnPattern(now);
            lastBeatTime = now;
            beatCount++;
        }

        const judgeCenterY = window.innerHeight - 150; 

        notes.forEach(n => {
            if (!n.active) return;
            const timeDiff = (n.targetTime + config.offset) - now; 
            n.y = judgeCenterY - (timeDiff * (config.speed / 16.6)) - 12;
            n.el.style.transform = `translate3d(0, ${n.y}px, 0)`;
            n.el.style.display = 'block';

            if (now > (n.targetTime + config.offset) + 100) {
                n.active = false; n.el.style.display = 'none';
                combo = 0; comboEl.innerText = combo;
                judgeEl.innerText = "MISS"; judgeEl.style.color = "#f04";
            }
        });
        requestAnimationFrame(update);
    }

    function spawnPattern(now) {
        let count = Math.min(config.density, Math.floor(Math.random() * config.density) + 1);
        let lanes = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
        for(let i = 0; i < count; i++) {
            const n = notes.find(note => !note.active);
            if(n) {
                n.active = true; n.lane = lanes[i];
                n.targetTime = now + 1500;
                n.el.style.left = `calc(${n.lane * 25}% + 3px)`;
            }
        }
    }

    function judge(lane) {
        const now = performance.now();
        const target = notes.filter(n => n.active && n.lane === lane).sort((a, b) => a.targetTime - b.targetTime)[0];
        if (target) {
            const diff = Math.abs(now - (target.targetTime + config.offset));
            if (diff < 100) {
                target.active = false; target.el.style.display = 'none';
                if (diff <= 33.33) { judgeEl.innerText = "PERFECT"; judgeEl.style.color = "#0ff"; }
                else if (diff <= 66.66) { judgeEl.innerText = "GREAT"; judgeEl.style.color = "#ff0"; }
                else { judgeEl.innerText = "GOOD"; judgeEl.style.color = "#fff"; }
                combo++; comboEl.innerText = combo;
            }
        }
    }

    // 最初の1回目のタップで確実にstartGameを呼ぶ
    window.addEventListener('touchstart', (e) => {
        if (!isPlaying) { 
            startGame(); 
            e.preventDefault();
            return; 
        }
        for (let i = 0; i < e.changedTouches.length; i++) {
            const lane = Math.floor((e.changedTouches[i].clientX / window.innerWidth) * 4);
            judge(lane);
        }
    }, {passive: false});

    window.onkeydown = (e) => {
        if (!isPlaying) { startGame(); return; }
        const lane = {'d':0, 'f':1, 'j':2, 'k':3}[e.key.toLowerCase()];
        if (lane !== undefined) judge(lane);
    };
</script>
</body>
</html>
