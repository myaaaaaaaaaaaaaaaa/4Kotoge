<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>V24 - Sync Beat</title>
    <style>
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #000; margin: 0; overflow: hidden; font-family: 'Consolas', monospace; touch-action: none; color: #fff; }
        #game-area {
            position: relative; width: 100%; max-width: 600px; height: 100vh;
            margin: 0 auto; background: #050508; border-left: 1px solid #444; border-right: 1px solid #444;
        }
        #judge-box {
            position: absolute; bottom: 150px; width: 100%; height: 24px;
            background: rgba(0, 255, 255, 0.1); border-top: 2px solid #0ff; border-bottom: 2px solid #0ff;
            z-index: 10;
        }
        .note {
            position: absolute; width: calc(25% - 10px); height: 16px;
            background: #fff; border-radius: 2px; display: none; z-index: 5;
        }
        #ui { position: absolute; top: 15%; width: 100%; text-align: center; pointer-events: none; z-index: 20; }
        #judge-text { font-size: 3rem; font-weight: 900; height: 3.5rem; }
        #combo { font-size: 4rem; font-weight: bold; }
        #bpm-display { position: absolute; top: 10px; right: 10px; color: #0f0; font-size: 1rem; }
    </style>
</head>
<body>

<div id="ui">
    <div id="judge-text">TAP TO START</div>
    <div id="combo">0</div>
</div>
<div id="bpm-display">BPM: 160 (16th Beat)</div>

<div id="game-area">
    <div id="judge-box"></div>
    <div id="notes-container"></div>
</div>

<script>
    const container = document.getElementById('notes-container');
    const comboEl = document.getElementById('combo');
    const judgeEl = document.getElementById('judge-text');
    const judgeBox = document.getElementById('judge-box');
    
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const BPM = 160; 
    const NOTE_SPEED = 12; 
    const JUDGE_Y = window.innerHeight - 150 - 12;
    
    let isPlaying = false, notes = [], combo = 0;
    let nextNoteTime = 0.0;
    const scheduleAheadTime = 0.1; // 秒

    // ビート音と打鍵音
    function playClick(time, freq, dur, vol) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine'; osc.frequency.setValueAtTime(freq, time);
        gain.gain.setValueAtTime(vol, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
        osc.start(time); osc.stop(time + dur);
    }

    // ノーツプール
    for (let i = 0; i < 200; i++) {
        const div = document.createElement('div');
        div.className = 'note';
        container.appendChild(div);
        notes.push({ el: div, y: -50, lane: 0, active: false });
    }

    function spawnNote() {
        const n = notes.find(note => !note.active);
        if(n) {
            n.active = true;
            n.lane = Math.floor(Math.random() * 4);
            n.y = -50;
            n.el.style.display = 'block';
            n.el.style.left = `calc(${n.lane * 25}% + 5px)`;
        }
    }

    // メインループ（音と生成の同期）
    function scheduler() {
        while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
            // 背景ビート音を鳴らす（4分音符ごと）
            const beatInterval = 60.0 / BPM;
            const subInterval = beatInterval / 4; // 16分音符
            
            // 背景ガイド音 (4分拍子でアクセント)
            const isDownBeat = Math.round(nextNoteTime / beatInterval) % 4 === 0;
            playClick(nextNoteTime, isDownBeat ? 880 : 440, 0.05, 0.02);
            
            spawnNote();
            nextNoteTime += subInterval;
        }
        if(isPlaying) setTimeout(scheduler, 25);
    }

    function update() {
        if (!isPlaying) return;
        notes.forEach(n => {
            if (!n.active) return;
            n.y += NOTE_SPEED;
            n.el.style.transform = `translate3d(0, ${n.y}px, 0)`;
            if (n.y > window.innerHeight) {
                n.active = false; n.el.style.display = 'none';
                combo = 0; comboEl.innerText = combo;
                judgeEl.innerText = "MISS"; judgeEl.style.color = "#f04";
            }
        });
        requestAnimationFrame(update);
    }

    function judge(lane) {
        const target = notes.filter(n => n.active && n.lane === lane)
                            .sort((a, b) => b.y - a.y)[0];
        if (target && target.y > JUDGE_Y - 70 && target.y < JUDGE_Y + 70) {
            const diff = Math.abs(target.y - JUDGE_Y);
            target.active = false; target.el.style.display = 'none';
            playClick(audioCtx.currentTime, 1200, 0.04, 0.05); // 打鍵音
            if (diff < 10) { judgeEl.innerText = "MARVELOUS"; judgeEl.style.color = "#fff"; }
            else if (diff < 25) { judgeEl.innerText = "PERFECT"; judgeEl.style.color = "#0ff"; }
            else { judgeEl.innerText = "GREAT"; judgeEl.style.color = "#ff0"; }
            combo++; comboEl.innerText = combo;
        }
    }

    const start = () => {
        if (isPlaying) return;
        audioCtx.resume();
        isPlaying = true;
        judgeEl.innerText = "";
        nextNoteTime = audioCtx.currentTime;
        scheduler();
        update();
    };

    window.addEventListener('touchstart', (e) => {
        if (!isPlaying) { start(); return; }
        for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];
            const lane = Math.floor((touch.clientX / window.innerWidth) * 4);
            judge(lane);
        }
    }, {passive: false});

    window.onkeydown = (e) => {
        if (!isPlaying) { start(); return; }
        const lane = {'d':0, 'f':1, 'j':2, 'k':3}[e.key.toLowerCase()];
        if (lane !== undefined) judge(lane);
    };
</script>
</body>
</html>
