<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>V18 Ultimate - Density Restored</title>
    <style>
        :root { 
            --accent: #00ffff; --p-deep: linear-gradient(135deg, #ff0000, #ff00ff, #0000ff); 
            --p-pale: linear-gradient(135deg, #ffffff, #a0e0ff, #ffffff);
            --great: #ff69b4; --good: #4caf50; --miss: #808080;
        }
        body { background: #000; margin: 0; overflow: hidden; touch-action: none; font-family: sans-serif; color: white; }
        #start-screen, #game-screen { width: 100vw; height: 100vh; position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #game-screen { display: none; }
        .menu-card { background: #111; padding: 20px; border-radius: 12px; border: 1px solid #444; width: 380px; text-align: center; }
        .setting-item { margin: 8px 0; text-align: left; font-size: 0.8rem; }
        select, input { width: 100%; padding: 8px; background: #222; color: white; border: 1px solid #555; border-radius: 4px; }
        button { padding: 15px; background: var(--accent); border: none; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; }
        
        #game-container { width: 100%; max-width: 500px; height: 100%; position: relative; border-left: 2px solid #333; border-right: 2px solid #333; }
        .lane { position: absolute; top: 0; width: 25%; height: 100%; border-right: 1px solid #222; }
        .target-mark { position: absolute; bottom: 138px; width: 90%; left: 5%; height: 24px; border-top: 2px solid #0ff; border-bottom: 2px solid #0ff; opacity: 0.5; }
        .note { position: absolute; width: 90%; left: 5%; height: 24px; background: #fff; border-radius: 3px; display: none; will-change: transform; }
        #ui-layer { position: absolute; top: 20%; width: 100%; text-align: center; pointer-events: none; }
        #judge-text { font-size: 3rem; font-weight: 900; }
    </style>
</head>
<body>

<div id="start-screen">
    <div class="menu-card">
        <h2 style="color:var(--accent)">V18 HYBRID ENGINE</h2>
        <div class="setting-item"><label>練習モード</label><select id="mode"><option value="random">完全ランダム</option><option value="stair">階段</option></select></div>
        <div class="setting-item"><label>最大同時押し(密度)</label><select id="density"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></div>
        <div class="setting-item"><label>BPM</label><input type="number" id="bpm" value="120"></div>
        <div class="setting-item"><label>OFFSET (ms)</label><input type="number" id="off" value="120"></div>
        <button onclick="initGame()">START</button>
    </div>
</div>

<div id="game-screen">
    <div id="ui-layer"><div id="judge-text"></div><div id="combo" style="font-size:3rem">0</div></div>
    <div id="game-container">
        <div class="lane" style="left:0"></div><div class="lane" style="left:25%"></div>
        <div class="lane" style="left:50%"></div><div class="lane" style="left:75%"></div>
        <div class="target-mark"></div>
        <div id="notes-container"></div>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let isPlaying = false, notes = [], combo = 0, lastSpawn = 0;
    let config = { bpm: 120, offset: 120, density: 1, mode: 'random', speed: 11 };

    for(let i=0; i<200; i++) {
        const div = document.createElement('div'); div.className = 'note';
        document.getElementById('notes-container').appendChild(div);
        notes.push({ el: div, active: false, lane: 0, targetTime: 0 });
    }

    function initGame() {
        config.bpm = parseInt(document.getElementById('bpm').value);
        config.offset = parseInt(document.getElementById('off').value);
        config.density = parseInt(document.getElementById('density').value);
        config.mode = document.getElementById('mode').value;
        
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';
        audioCtx.resume();
        isPlaying = true;
        lastSpawn = performance.now();
        update();
    }

    function spawn() {
        // あなたが消されたと怒った「密度」に基づいた同時押し生成ロジック
        let count = Math.min(config.density, Math.floor(Math.random() * config.density) + 1);
        let lanes = [0,1,2,3].sort(() => Math.random() - 0.5);
        
        for(let i=0; i<count; i++) {
            const n = notes.find(note => !note.active);
            if(n) {
                n.active = true; n.lane = lanes[i];
                n.targetTime = performance.now() + 1500;
                n.el.style.left = `calc(${n.lane * 25}% + 5px)`;
                n.el.style.display = 'block';
            }
        }
    }

    function update() {
        if(!isPlaying) return;
        const now = performance.now();
        const interval = 60000 / config.bpm / 2;

        if(now - lastSpawn > interval) {
            spawn();
            lastSpawn = now;
        }

        const judgeY = window.innerHeight - 150;
        notes.forEach(n => {
            if(!n.active) return;
            const diff = (n.targetTime + config.offset) - now;
            const y = judgeY - (diff * (config.speed / 16.6)) - 12;
            n.el.style.transform = `translate3d(0, ${y}px, 0)`;
            if(diff < -150) { n.active = false; n.el.style.display = 'none'; combo = 0; }
        });
        requestAnimationFrame(update);
    }

    function judge(lane) {
        const now = performance.now();
        const target = notes.filter(n => n.active && n.lane === lane).sort((a,b) => a.targetTime - b.targetTime)[0];
        if(target) {
            const diff = Math.abs(now - (target.targetTime + config.offset));
            if(diff < 150) {
                target.active = false; target.el.style.display = 'none';
                combo++; document.getElementById('combo').innerText = combo;
                const txt = diff < 33.33 ? "PERFECT" : (diff < 70 ? "GREAT" : "GOOD");
                document.getElementById('judge-text').innerText = txt;
            }
        }
    }

    window.addEventListener('touchstart', e => {
        if(!isPlaying) return;
        for(let i=0; i<e.changedTouches.length; i++) {
            judge(Math.floor((e.changedTouches[i].clientX / window.innerWidth) * 4));
        }
    });
</script>
</body>
</html>
