<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>V34 - Pattern Master</title>
    <style>
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #000; margin: 0; overflow: hidden; font-family: sans-serif; touch-action: none; color: #fff; }
        #game-area {
            position: relative; width: 100%; max-width: 600px; height: 100vh;
            margin: 0 auto; background: #030305; border-left: 2px solid #333; border-right: 2px solid #333;
        }
        .judge-rail { position: absolute; width: 100%; height: 2px; background: #0ff; box-shadow: 0 0 10px #0ff; z-index: 10; bottom: 150px; opacity: 0.6; } 
        .note {
            position: absolute; width: calc(25% - 6px); height: 24px;
            background: #fff; border-radius: 2px; display: none; z-index: 5;
            will-change: transform;
        }
        #ui { position: absolute; top: 15%; width: 100%; text-align: center; pointer-events: none; z-index: 20; }
        #judge-text { font-size: 3.5rem; font-weight: 900; height: 4.5rem; }
        #combo { font-size: 4rem; font-weight: bold; }
        #controls {
            position: absolute; top: 10px; left: 10px; z-index: 30;
            background: rgba(0,0,0,0.8); padding: 12px; border-radius: 8px; font-size: 12px; border: 1px solid #444;
        }
        .input-box { background: #222; color: #fff; border: 1px solid #666; width: 50px; padding: 2px; text-align: center; }
        select { background: #222; color: #fff; border: 1px solid #666; font-size: 12px; }
    </style>
</head>
<body>

<div id="ui">
    <div id="judge-text">START</div>
    <div id="combo">0</div>
</div>

<div id="controls">
    BPM: <input type="number" id="inp-bpm" class="input-box" value="120">
    OFF: <input type="number" id="inp-off" class="input-box" value="120">ms<br>
    密度: <input type="number" id="inp-den" class="input-box" value="1" min="1" max="4">
    Mode: <select id="inp-mode">
        <option value="stairs">階段 (Stairs)</option>
        <option value="trills">トリル (Trills)</option>
        <option value="jumps">ジャンプストリーム</option>
        <option value="random">完全ランダム</option>
    </select>
</div>

<div id="game-area">
    <div class="judge-rail"></div>
    <div id="notes-container"></div>
</div>

<script>
    const container = document.getElementById('notes-container');
    const comboEl = document.getElementById('combo');
    const judgeEl = document.getElementById('judge-text');
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    let config = { bpm: 120, offset: 120, speed: 11, density: 1, mode: 'stairs' };
    let isPlaying = false, notes = [], combo = 0, lastBeatTime = 0, beatCount = 0;
    let patternState = { lane: 0, dir: 1, trillSide: 0 }; // パターン生成用ステート

    for (let i = 0; i < 200; i++) {
        const div = document.createElement('div');
        div.className = 'note';
        container.appendChild(div);
        notes.push({ el: div, y: -50, lane: 0, active: false, targetTime: 0 });
    }

    function startGame() {
        if (isPlaying) return;
        config.bpm = parseInt(document.getElementById('inp-bpm').value);
        config.offset = parseInt(document.getElementById('inp-off').value);
        config.density = parseInt(document.getElementById('inp-den').value);
        config.mode = document.getElementById('inp-mode').value;
        audioCtx.resume();
        isPlaying = true;
        judgeEl.innerText = "";
        lastBeatTime = performance.now();
        beatCount = 0;
        update();
    }

    function spawnPattern(now) {
        let spawnLanes = [];
        
        if (config.mode === 'stairs') {
            spawnLanes.push(patternState.lane);
            patternState.lane += patternState.dir;
            if (patternState.lane > 3 || patternState.lane < 0) {
                patternState.dir *= -1;
                patternState.lane += patternState.dir * 2;
            }
        } else if (config.mode === 'trills') {
            spawnLanes.push(patternState.trillSide === 0 ? 1 : 2);
            patternState.trillSide = 1 - patternState.trillSide;
        } else if (config.mode === 'jumps') {
            // ジャンプストリーム（単押しと同時押しの混合）
            spawnLanes.push(Math.floor(Math.random() * 4));
            if (beatCount % 2 === 0) spawnLanes.push((spawnLanes[0] + 2) % 4);
        } else {
            // ランダムかつ密度反映
            let count = Math.min(config.density, Math.floor(Math.random() * config.density) + 1);
            let pool = [0,1,2,3].sort(() => Math.random() - 0.5);
            spawnLanes = pool.slice(0, count);
        }

        spawnLanes.forEach(lane => {
            const n = notes.find(note => !note.active);
            if(n) {
                n.active = true; n.lane = lane;
                n.targetTime = now + 1500;
                n.el.style.left = `calc(${n.lane * 25}% + 3px)`;
            }
        });
    }

    function update() {
        if (!isPlaying) return;
        const now = performance.now();
        const spawnInterval = (60000 / config.bpm) / 2;

        if (now - lastBeatTime > spawnInterval) {
            spawnPattern(now);
            lastBeatTime = now;
            beatCount++;
        }

        const judgeCenterY = window.innerHeight - 150; 
        notes.forEach(n => {
            if (!n.active) return;
            const timeDiff = (n.targetTime + config.offset) - now; 
            n.y = judgeCenterY - (timeDiff * (config.speed / 16.6)) - 12;
            n.el.style.transform = `translate3d(0, ${n.y}px, 0)`;
            n.el.style.display = 'block';

            if (now > (n.targetTime + config.offset) + 100) {
                n.active = false; n.el.style.display = 'none';
                combo = 0; comboEl.innerText = combo;
                judgeEl.innerText = "MISS"; judgeEl.style.color = "#f04";
            }
        });
        requestAnimationFrame(update);
    }

    function judge(lane) {
        const now = performance.now();
        const target = notes.filter(n => n.active && n.lane === lane).sort((a, b) => a.targetTime - b.targetTime)[0];
        if (target) {
            const diff = Math.abs(now - (target.targetTime + config.offset));
            if (diff < 100) {
                target.active = false; target.el.style.display = 'none';
                combo++; comboEl.innerText = combo;
                if (diff <= 33.33) { judgeEl.innerText = "PERFECT"; judgeEl.style.color = "#0ff"; }
                else if (diff <= 66.66) { judgeEl.innerText = "GREAT"; judgeEl.style.color = "#ff0"; }
                else { judgeEl.innerText = "GOOD"; judgeEl.style.color = "#fff"; }
            }
        }
    }

    window.addEventListener('touchstart', (e) => {
        if (!isPlaying) { startGame(); return; }
        for (let i = 0; i < e.changedTouches.length; i++) {
            judge(Math.floor((e.changedTouches[i].clientX / window.innerWidth) * 4));
        }
    }, {passive: false});
</script>
</body>
</html>
