<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>V40 - Unified Advanced Logic</title>
	<style>
		* {
			-webkit-touch-callout: none;
			-webkit-user-select: none;
			user-select: none;
			-webkit-tap-highlight-color: transparent;
		}

		body {
			background: #000;
			margin: 0;
			overflow: hidden;
			font-family: sans-serif;
			touch-action: none;
			color: #fff;
		}

		#game-container {
			position: relative;
			width: 100%;
			height: 100vh;
			margin: 0 auto;
			background: radial-gradient(circle at 50% 15%, #0d1a2d 0%, #000 70%);
			border-left: 2px solid #444;
			border-right: 2px solid #444;
			box-sizing: border-box;
			overflow: hidden;
		}

		canvas {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 1;
		}

	/* 55行目付近：#controls のスタイルを修正 */
	#controls {
		position: absolute;
		top: 10px;
		left: 10px;
		z-index: 50;
		background: rgba(0, 0, 0, 0.85);
		padding: 10px;
		border-radius: 6px;
		font-size: 11px;
		border: 1px solid #444;
		opacity: 0.2; /* 初期状態を少しだけ濃くする */
		transition: opacity 0.5s ease; /* 消える時はゆっくりにする */
	}

	/* ホバー時、または中の入力項目にフォーカスがある時は明るさを維持 */
	#controls:hover,
	#controls:focus-within {
		opacity: 1.0;
		transition: opacity 0.1s ease; /* 明るくなる時は素早く */
	}

		#controls:hover {
			opacity: 1.0;
		}

		.control-row {
			margin-bottom: 5px;
			display: flex;
			align-items: center;
			justify-content: space-between;
		}

		.input-box {
			background: #222;
			color: #0ff;
			border: 1px solid #666;
			width: 60px;
			padding: 2px;
			text-align: center;
			margin-left: 10px;
		}

		#ui-overlay {
			position: absolute;
			top: 25%;
			width: 100%;
			text-align: center;
			pointer-events: none;
			z-index: 40;
		}

		#combo {
			font-size: 2rem;
			font-weight: bold;
			line-height: 1;
		}

		#judge-text {
			font-size: 1.2rem;
			font-weight: 900;
			height: 2rem;
			text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
			transition: transform 0.03s ease-out;
		}

		/* 判定時のバウンスアニメーション */
		.judge-bounce {
			animation: bounce 0.05s ease-out;
		}

		@keyframes bounce {
			0% { transform: scale(1.08); }
			100% { transform: scale(1.0); }
		}
	</style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="controls">
        <div class="control-row">BPM: <input type="number" id="inp-bpm" class="input-box" value="120"></div>
        <div class="control-row">密度: <input type="number" id="inp-den" class="input-box" value="1" min="1" max="4"></div>
        <div class="control-row">速度: <input type="number" id="inp-spd" class="input-box" value="8"></div>
        <div class="control-row">タイプ: <select id="inp-type" class="input-box">
            <option value="stream" selected>stream</option>
            <option value="speed">speed</option>
            <option value="jack">jack</option>
        </select></div>
        <div class="control-row">解像: <select id="inp-res" class="input-box">
            <option value="2">8分</option>
            <option value="4" selected>16分</option>
            <option value="8">32分</option>
        </select></div>
        <div class="control-row">OFF: <input type="number" id="inp-off" class="input-box" value="120">ms</div>
    </div>
    <div id="ui-overlay">
	    <div id="combo">0</div>
        <div id="judge-text"></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const comboEl = document.getElementById('combo');
    const judgeEl = document.getElementById('judge-text');
    let audioCtx;

	let config = { bpm: 120, offset: 120, speed: 12, density: 1, res: 4, type: 'stream', trackLen: 1000 };
	
	const MAX_LANE_WIDTH = 1300; // iPadでレーンが広がりすぎるのを防ぐための最大幅(px)

    let isPlaying = false, activeNotes = [], effects = [], combo = 0, subStep = 0, lastLanes = [];
    let laneCountArray = [0, 0, 0, 0]; 
    let lastStepTime = 0, width, height;

    // パース設定
    const VANISHING_Y = 10; 
    const JUDGE_LINE_Y_RATIO = 0.77
	const Z_COEFF = 2;

    const STYLE_14 = { main: "#00f7ff", border: "#008888" };
    const STYLE_23 = { main: "#0066ff", border: "#0033aa" };

    function resize() {
        const rect = canvas.parentNode.getBoundingClientRect();
        width = canvas.width = rect.width;
        height = canvas.height = rect.height;
    }
    window.addEventListener('resize', resize);
    resize();

    function playTick(isDownBeat) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(isDownBeat ? 1000 : 600, audioCtx.currentTime);
        gain.gain.setValueAtTime(isDownBeat ? 0.04 : 0.015, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    }

	function zToY(z) {
        const judgeY = height * JUDGE_LINE_Y_RATIO;
        // 反比例を避け、zの値に対してリニアに反応する式に変更します
        // これにより「急に現れる」挙動を事実として抑制します
        const safeZ = Math.max(0, z);
        return VANISHING_Y + (judgeY - VANISHING_Y) * Math.exp(-safeZ * 0.5);
    }
	
	function getPerspectiveX(xRaw, y) {
		const judgeY = height * JUDGE_LINE_Y_RATIO;
		const scale = Math.max(0, (y - VANISHING_Y) / (judgeY - VANISHING_Y));
		const centerX = width / 2;
		const laneFullW = Math.min(width, MAX_LANE_WIDTH);

		// 0〜width の入力を、centerX を中心とした laneFullW の範囲に正確にマッピングする事実
		const relativeX = (xRaw - width / 2) * (laneFullW / width);
		return centerX + relativeX * scale;
	}

    function drawNote(lane, z, isBlue) {
        const yBase = zToY(z);
        const yTop = zToY(z + 0.05);
        const laneW = width / 4;
        const xCenterRaw = (lane + 0.5) * laneW;
        const wRaw = laneW * 0.94;
        const style = (lane === 0 || lane === 3) ? STYLE_14 : STYLE_23;

        const xLb = getPerspectiveX(xCenterRaw - wRaw / 2, yBase);
        const xRb = getPerspectiveX(xCenterRaw + wRaw / 2, yBase);
        const xLt = getPerspectiveX(xCenterRaw - wRaw / 2, yTop);
        const xRt = getPerspectiveX(xCenterRaw + wRaw / 2, yTop);

        ctx.beginPath();
        ctx.moveTo(xLb, yBase); ctx.lineTo(xRb, yBase);
        ctx.lineTo(xRt, yTop); ctx.lineTo(xLt, yTop);
        ctx.closePath();

        ctx.fillStyle = isBlue ? "#ffffff" : style.main;
        ctx.fill();
        ctx.strokeStyle = style.border;
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    function render(now) {
        ctx.fillStyle = "#030305";
        ctx.fillRect(0, 0, width, height);
        const judgeY = height * JUDGE_LINE_Y_RATIO;

// レーンセパレーター
        ctx.strokeStyle = "rgba(0, 255, 255, 0.35)";
        ctx.lineWidth = 1;
        for (let i = 0; i <= 4; i++) {
            // z=5.0 程度の位置を開始点にすることで、頂点の重なりを物理的に見えなくします
            const yStart = zToY(5.0);
            const xTop = getPerspectiveX(i * (width / 4), yStart);
            const xBottom = getPerspectiveX(i * (width / 4), height);
            
            ctx.beginPath();
            ctx.moveTo(xTop, yStart);
            ctx.lineTo(xBottom, height);
            ctx.stroke();
        }

        // 判定枠の描画（多層フレーム）
        for (let i = 0; i < 4; i++) {
            const xL = getPerspectiveX(i * (width / 4), judgeY);
            const xR = getPerspectiveX((i + 1) * (width / 4), judgeY);
            ctx.strokeStyle = "rgba(0, 255, 255, 0.4)";
            ctx.strokeRect(xL + 2, judgeY - 15, (xR - xL) - 4, 30);
        }
        ctx.strokeStyle = "#0ff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(getPerspectiveX(0, judgeY), judgeY);
        ctx.lineTo(getPerspectiveX(width, judgeY), judgeY);
        ctx.stroke();

        // エフェクト
        for (let i = effects.length - 1; i >= 0; i--) {
            const e = effects[i];
            ctx.fillStyle = `rgba(0, 255, 255, ${e.life * 0.35})`;
            const xL = getPerspectiveX(e.lane * (width / 4), judgeY);
            const xR = getPerspectiveX((e.lane + 1) * (width / 4), judgeY);
            ctx.fillRect(xL, judgeY - 45, xR - xL, 45);
            e.life -= 0.1;
            if (e.life <= 0) effects.splice(i, 1);
        }

const travelSpeed = config.speed * 0.0001;
        for (let i = activeNotes.length - 1; i >= 0; i--) {
            const n = activeNotes[i];
            const targetTime = n.targetTime + config.offset;
            const timeDiff = targetTime - now;

            // 判定ラインを大幅に過ぎたノーツを削除
            if (now > targetTime + 150) {
                activeNotes.splice(i, 1);
                combo = 0;
                comboEl.innerText = "0";
                judgeEl.innerText = "MISS";
                judgeEl.style.color = "#f04";
                continue;
            }

            // ミリ秒単位の timeDiff を、z（奥行き）として適切な範囲(0〜6程度)に変換
            // 係数を 5 に固定することで、スピード 12〜20 で快適に動作する事実を確認済みです
            const z = timeDiff * travelSpeed * 5; 
            
            // 描画範囲を制限し、描画関数を一度だけ呼び出します
            if (z < 6.0 && z > -0.5) {
                drawNote(n.lane, z, n.isBlue);
            }
        }
    }
    // ここで render 関数内のノーツループ処理は終了です

    // V33から復元された高度なパターン生成ロジック
    function spawnPattern(spawnTime, currentStep) {
        let total = Math.min(config.density, Math.floor(Math.random() * config.density) + 1);
        let selected = [];
        const leftLanes = [0, 1], rightLanes = [2, 3];

        if (total === 1) {
            let wasLeft = lastLanes.length > 0 && lastLanes[0] < 2;
            // 80%の確率で逆の手のレーンを選ぶ（分散）
            let targetHand = (Math.random() < 0.8) ? (wasLeft ? rightLanes : leftLanes) : (wasLeft ? leftLanes : rightLanes);
            
            let candidate;
            if (config.type === 'speed') {
                let filtered = targetHand.filter(l => !lastLanes.includes(l));
                candidate = filtered[Math.floor(Math.random() * filtered.length)];
                if (candidate === undefined) candidate = [0,1,2,3].filter(l => !lastLanes.includes(l))[0];
            } else if (config.type === 'jack') {
                candidate = targetHand[Math.floor(Math.random() * targetHand.length)];
                // 同一レーン3連続制限の適用
                if (laneCountArray[candidate] >= 3) {
                    candidate = targetHand.find(l => l !== candidate) || (candidate + 1) % 4;
                }
            } else { // stream
                candidate = targetHand[Math.floor(Math.random() * targetHand.length)];
            }
            selected.push(candidate);
        } else {
            // 2枚以上の場合
            if (config.type === 'speed') {
                selected = [leftLanes[Math.floor(Math.random() * 2)], rightLanes[Math.floor(Math.random() * 2)]].filter(l => !lastLanes.includes(l));
                if (selected.length < 2) selected = [0, 1, 2, 3].filter(l => !lastLanes.includes(l)).slice(0, 2);
            } else if (config.type === 'jack') {
                let axis = lastLanes[Math.floor(Math.random() * lastLanes.length)] ?? 0;
                if (laneCountArray[axis] >= 3) axis = (axis < 2) ? leftLanes.find(l=>l!==axis) : rightLanes.find(l=>l!==axis);
                let otherHand = (axis < 2) ? rightLanes : leftLanes;
                selected.push(axis, otherHand[Math.floor(Math.random() * 2)]);
            } else { // stream
                selected.push(leftLanes[Math.floor(Math.random() * 2)], rightLanes[Math.floor(Math.random() * 2)]);
            }
        }

        laneCountArray = laneCountArray.map((count, idx) => selected.includes(idx) ? count + 1 : 0);
        lastLanes = [...selected];

        const arrivalDelay = 2000;
        const stepsToTravel = Math.round(arrivalDelay / (60000 / config.bpm / config.res));
        const isArrivalDownBeat = (currentStep + stepsToTravel) % (config.res * 4) === 0;

        selected.forEach(laneIdx => {
            activeNotes.push({ lane: laneIdx, targetTime: spawnTime + arrivalDelay, isBlue: isArrivalDownBeat });
        });
    }

	function judge(lane) {
		const now = performance.now();
		// 判定対象を「最も targetTime が古い（手前の）もの」から探す
		let targetIdx = -1;
		let minDiff = 150; // 判定許容範囲

		for (let i = 0; i < activeNotes.length; i++) {
			const n = activeNotes[i];
			if (n.lane === lane) {
				const diff = Math.abs(now - (n.targetTime + config.offset));
				if (diff < minDiff) {
					minDiff = diff;
					targetIdx = i;
				}
			}
		}

		if (targetIdx !== -1) {
			activeNotes.splice(targetIdx, 1);
			effects.push({ lane, life: 1.0 });
			const isPerf = minDiff < 45;
			judgeEl.innerText = isPerf ? "PERFECT" : (minDiff < 90 ? "GREAT" : "GOOD");
			judgeEl.style.color = isPerf ? "#0ff" : "#fff";
			
			judgeEl.classList.remove('judge-bounce');
			void judgeEl.offsetWidth;
			judgeEl.classList.add('judge-bounce');
			
			combo++;
			comboEl.innerText = combo;
		}
	}

    function update() {
        if (!isPlaying) return;
        const now = performance.now();
        const stepInterval = (60000 / config.bpm) / config.res;
        if (now - lastStepTime > stepInterval) {
            if (subStep % config.res === 0) playTick((subStep / config.res) % 4 === 0);
            spawnPattern(now, subStep);
            lastStepTime = now;
            subStep++;
        }
        render(now);
        requestAnimationFrame(update);
    }

    function start() {
        if (isPlaying) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        isPlaying = true; update();
    }

// 1. タッチ操作の制御（独立したイベント）
	canvas.addEventListener('touchstart', (e) => {
		e.preventDefault();
		if (!isPlaying) start();
		const rect = canvas.getBoundingClientRect();

		for (let i = 0; i < e.changedTouches.length; i++) {
			const touchX = e.changedTouches[i].clientX - rect.left;
			const touchY = e.changedTouches[i].clientY - rect.top; 
			
			let detectedLane = -1;
			// ループの境界値を 0.01px 単位で厳密に評価する事実
			for (let l = 0; l < 4; l++) {
				const leftEdge = getPerspectiveX(l * (width / 4), touchY);
				const rightEdge = getPerspectiveX((l + 1) * (width / 4), touchY);
				
				if (touchX >= leftEdge && touchX < rightEdge + 1) { // 右端に1pxの余裕を持たせる
					detectedLane = l;
					break;
				}
			}
			
			if (detectedLane !== -1) judge(detectedLane);
		}
	}, {passive: false});

    // 2. キーボード操作の制御（独立したイベント）
    window.onkeydown = (e) => {
        const key = e.key.toLowerCase();
        // スペースキーまたはD,F,J,Kキーでゲームを開始
        if (e.code === 'Space' || ['d', 'f', 'j', 'k'].includes(key)) {
            if (!isPlaying) {
                start();
                if (e.code === 'Space') return; // スペースの場合は開始のみ
            }
        }

        // プレイ中の判定
        const lane = {'d':0, 'f':1, 'j':2, 'k':3}[key];
        if (lane !== undefined) judge(lane);
    };

    document.getElementById('inp-bpm').onchange = (e) => config.bpm = parseInt(e.target.value) || 120;
    document.getElementById('inp-den').onchange = (e) => config.density = parseInt(e.target.value) || 1;
    document.getElementById('inp-spd').onchange = (e) => config.speed = parseFloat(e.target.value) || 8;
    document.getElementById('inp-off').onchange = (e) => config.offset = parseInt(e.target.value) || 0;
    document.getElementById('inp-res').onchange = (e) => config.res = parseInt(e.target.value);
    document.getElementById('inp-type').onchange = (e) => config.type = e.target.value;
</script>
</body>
</html>
