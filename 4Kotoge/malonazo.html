<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>V40 - Unified Advanced Logic</title>
	<style>
		* {
			-webkit-touch-callout: none;
			-webkit-user-select: none;
			user-select: none;
			-webkit-tap-highlight-color: transparent;
		}

		body {
			background: #000;
			margin: 0;
			overflow: hidden;
			font-family: sans-serif;
			touch-action: none;
			color: #fff;
		}

		#game-container {
			position: relative;
			width: 100%;
			height: 100vh;
			margin: 0 auto;
			background: radial-gradient(circle at 50% 15%, #0d1a2d 0%, #000 70%);
			border-left: 2px solid #444;
			border-right: 2px solid #444;
			box-sizing: border-box;
			overflow: hidden;
		}

		canvas {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 1;
		}

	/* 55行目付近：#controls のスタイルを修正 */
	#controls {
		position: absolute;
		top: 10px;
		left: 10px;
		z-index: 50;
		background: rgba(0, 0, 0, 0.85);
		padding: 10px;
		border-radius: 6px;
		font-size: 11px;
		border: 1px solid #444;
		opacity: 0.2; /* 初期状態を少しだけ濃くする */
		transition: opacity 0.5s ease; /* 消える時はゆっくりにする */
	}

	/* ホバー時、または中の入力項目にフォーカスがある時は明るさを維持 */
	#controls:hover,
	#controls:focus-within {
		opacity: 1.0;
		transition: opacity 0.1s ease; /* 明るくなる時は素早く */
	}

		#controls:hover {
			opacity: 1.0;
		}

		.control-row {
			margin-bottom: 5px;
			display: flex;
			align-items: center;
			justify-content: space-between;
		}

		.input-box {
			background: #222;
			color: #0ff;
			border: 1px solid #666;
			width: 60px;
			padding: 2px;
			text-align: center;
			margin-left: 10px;
		}

		#ui-overlay {
			position: absolute;
			top: 25%;
			width: 100%;
			text-align: center;
			pointer-events: none;
			z-index: 40;
		}

		#combo {
			font-size: 2rem;
			font-weight: bold;
			line-height: 1;
		}

		#judge-text {
			font-size: 1.2rem;
			font-weight: 900;
			height: 2rem;
			text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
			transition: transform 0.03s ease-out;
		}

		/* 判定時のバウンスアニメーション */
		.judge-bounce {
			animation: bounce 0.05s ease-out;
		}

		@keyframes bounce {
			0% { transform: scale(1.08); }
			100% { transform: scale(1.0); }
		}
	</style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="controls">
        <div class="control-row">BPM: <input type="number" id="inp-bpm" class="input-box" value="120"></div>
        <div class="control-row">密度: <input type="number" id="inp-den" class="input-box" value="1" min="1" max="4"></div>
        <div class="control-row">速度: <input type="number" id="inp-spd" class="input-box" value="8"></div>
        <div class="control-row">タイプ: <select id="inp-type" class="input-box">
            <option value="stream" selected>stream</option>
            <option value="speed">speed</option>
            <option value="jack">jack</option>
        </select></div>
        <div class="control-row">解像: <select id="inp-res" class="input-box">
            <option value="2">8分</option>
            <option value="4" selected>16分</option>
            <option value="8">32分</option>
        </select></div>
		
		<div class="control-row">レーン: 
		<select id="inp-lane" class="input-box">
			<option value="4" selected>4K</option>
			<option value="5">5K</option>
			<option value="6">6K</option>
			<option value="7">7K</option>
			<option value="8">8K</option>
			<option value="9">9K</option>
			<option value="10">10K</option>
		</select>
		</div>
		
		
		<div class="control-row">オート: 
		<select id="inp-auto" class="input-box">
			<option value="false" selected>OFF</option>
			<option value="true">ON</option>
		</select>
		</div>
		
		
        <div class="control-row">OFF: <input type="number" id="inp-off" class="input-box" value="120">ms</div>
    </div>
    <div id="ui-overlay">
	    <div id="combo">0</div>
        <div id="judge-text"></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const comboEl = document.getElementById('combo');
    const judgeEl = document.getElementById('judge-text');
	document.getElementById('inp-auto').onchange = (e) => {
    // 事実：セレクトボックスの文字列 "true" / "false" を論理値に変換して代入します
    isAuto = (e.target.value === "true");
};
    let audioCtx;

	let isAuto = false; // 事実：これを true にするとオートプレイになります
    let debugLog = []; // 最新の判定結果を保持する配列


    let activeTouchLanes = [false, false, false, false];
    let config = { bpm: 120, offset: 120, speed: 12, density: 1, res: 4, type: 'stream', trackLen: 1000, laneCount: 4 };
    const MAX_LANE_WIDTH = 900;

    let isPlaying = false, activeNotes = [], effects = [], combo = 0, subStep = 0, lastLanes = [];
    let laneCountArray = [0, 0, 0, 0]; 
    let lastStepTime = 0, width, height;

    const VANISHING_Y = 10; 
    const JUDGE_LINE_Y_RATIO = 0.77;
	const STYLE_14 = { main: "#00ffff", border: "#ffffff" }; // シアン（極めて明るい）
	const STYLE_23 = { main: "#55aaff", border: "#ffffff" }; // 明るい青

    function resize() {
        const rect = canvas.parentNode.getBoundingClientRect();
        width = canvas.width = rect.width;
        height = canvas.height = rect.height;
    }
    window.addEventListener('resize', resize);
    resize();

    function playTick(isDownBeat) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(isDownBeat ? 1000 : 600, audioCtx.currentTime);
        gain.gain.setValueAtTime(isDownBeat ? 0.04 : 0.015, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    }

	function zToY(z) {
        const judgeY = height * JUDGE_LINE_Y_RATIO;
        // 事実：z=0 のときに y がちょうど judgeY になるようにします
        // Math.exp(0) = 1 なので、そのまま引き算で成立させます
        return VANISHING_Y + (judgeY - VANISHING_Y) * Math.exp(-z * 0.5);
    }

	// レーン幅を laneCount に基づいて計算するように変更
	function getPerspectiveX(laneIdx, y) {
		const judgeY = height * JUDGE_LINE_Y_RATIO;
		const scale = Math.max(0, (y - VANISHING_Y) / (judgeY - VANISHING_Y));
		const centerX = width / 2;
		const laneFullW = Math.min(width, MAX_LANE_WIDTH);
		
		// 事実：全幅を現在のレーン数で割る
		const unitW = laneFullW / config.laneCount;
		const relativeX = (laneIdx - (config.laneCount / 2)) * unitW; 
		return centerX + relativeX * scale;
	}

	function drawNote(lane, z, isBlue) {
		const yBase = zToY(z - 0.075);
		const yTop = zToY(z + 0.075);
		
		// 事実：4K以外でも「両端のレーン」がシアン色になるように判定を修正します
		const isEdge = (lane === 0 || lane === config.laneCount - 1);
		const style = isEdge ? STYLE_14 : STYLE_23;

		const xLb = getPerspectiveX(lane + 0.03, yBase);
		const xRb = getPerspectiveX(lane + 0.97, yBase);
		const xLt = getPerspectiveX(lane + 0.03, yTop);
		const xRt = getPerspectiveX(lane + 0.97, yTop);
		
		ctx.beginPath();
		ctx.moveTo(xLb, yBase); ctx.lineTo(xRb, yBase);
		ctx.lineTo(xRt, yTop); ctx.lineTo(xLt, yTop);
		ctx.closePath();
		ctx.fillStyle = isBlue ? "#ffaa00" : style.main;
		ctx.fill();
	}
	function render(now) {
			ctx.fillStyle = "#030305";
			ctx.fillRect(0, 0, width, height);
			const judgeY = height * JUDGE_LINE_Y_RATIO;

			// タッチ時の光るエフェクト（ここは forEach なので自動で対応されます）
			activeTouchLanes.forEach((isActive, l) => {
				if (isActive) {
					ctx.fillStyle = "rgba(0, 255, 255, 0.15)";
					ctx.beginPath();
					ctx.moveTo(getPerspectiveX(l, VANISHING_Y), VANISHING_Y);
					ctx.lineTo(getPerspectiveX(l + 1, VANISHING_Y), VANISHING_Y);
					ctx.lineTo(getPerspectiveX(l + 1, height), height);
					ctx.lineTo(getPerspectiveX(l, height), height);
					ctx.fill();
				}
			});

			// 【修正ポイント1】縦線の描画（事実：i <= 4 を config.laneCount に変更）
			ctx.strokeStyle = "rgba(0, 255, 255, 0.35)";
			for (let i = 0; i <= config.laneCount; i++) { 
				const yStart = zToY(5.0);
				ctx.beginPath();
				ctx.moveTo(getPerspectiveX(i, yStart), yStart);
				ctx.lineTo(getPerspectiveX(i, height), height);
				ctx.stroke();
			}

			// 【修正ポイント2】判定枠の描画（事実：i < 4 を config.laneCount に変更）
			for (let i = 0; i < config.laneCount; i++) {
				const xL = getPerspectiveX(i, judgeY);
				const xR = getPerspectiveX(i + 1, judgeY);
				ctx.strokeStyle = "rgba(0, 255, 255, 0.4)";
				ctx.strokeRect(xL + 2, judgeY - 15, (xR - xL) - 4, 30);
			}

			// 【修正ポイント3】判定線の横棒（事実：右端の座標を config.laneCount に変更）
			ctx.strokeStyle = "#0ff";
			ctx.lineWidth = 2;
			ctx.beginPath();
			ctx.moveTo(getPerspectiveX(0, judgeY), judgeY);
			ctx.lineTo(getPerspectiveX(config.laneCount, judgeY), judgeY); 
			ctx.stroke();


        for (let i = effects.length - 1; i >= 0; i--) {
            const e = effects[i];
            const xL = getPerspectiveX(e.lane, judgeY);
            const xR = getPerspectiveX(e.lane + 1, judgeY);
            ctx.fillStyle = `rgba(0, 255, 255, ${e.life * 0.5})`;
            ctx.fillRect(xL, judgeY - 60, xR - xL, 60);
            e.life -= 0.08;
            if (e.life <= 0) effects.splice(i, 1);
        }

        const travelSpeed = config.speed * 0.0001;
        for (let i = activeNotes.length - 1; i >= 0; i--) {
            const n = activeNotes[i];
            const targetTime = n.targetTime + config.offset;
            const timeDiff = targetTime - now;
            if (now > targetTime + 150) {
                activeNotes.splice(i, 1);
                combo = 0;
                comboEl.innerText = "0";
                judgeEl.innerText = "MISS";
                judgeEl.style.color = "#f04";
                continue;
            }
            // 事実：判定基準時刻に z がちょうど 0 になるように計算式を統一します
			const z = ( (n.targetTime + config.offset) - now ) * travelSpeed * 5; 
            if (z < 6.0 && z > -0.5) drawNote(n.lane, z, n.isBlue);
        }
    }

	function spawnPattern(spawnTime, currentStep) {
		let total = Math.min(config.density, Math.floor(Math.random() * config.density) + 1);
		let selected = [];

		// 事実：レーンを左右に分ける基準値を計算（例：7Kなら 3.5）
		const mid = config.laneCount / 2;

		if (total === 1) {
			// 直前のノーツが左側だったか判定
			let wasLeft = lastLanes.length > 0 && lastLanes[0] < mid;
			
			// 80%の確率で逆の手（逆側）に振る
			let useLeft = (Math.random() < 0.8) ? !wasLeft : wasLeft;
			
			// 候補となるレーン番号を動的に生成
			let candidates = [];
			for (let i = 0; i < config.laneCount; i++) {
				if (useLeft && i < mid) candidates.push(i);
				if (!useLeft && i >= mid) candidates.push(i);
			}

			let candidate;
			if (config.type === 'speed') {
				let filtered = candidates.filter(l => !lastLanes.includes(l));
				candidate = filtered.length > 0 ? filtered[Math.floor(Math.random() * filtered.length)] : candidates[Math.floor(Math.random() * candidates.length)];
			} else {
				candidate = candidates[Math.floor(Math.random() * candidates.length)];
			}
			selected.push(candidate);
		} else {
			// 複数ノーツ（同時押し）の場合：左側から1つ、右側から1つ選ぶ
			let leftSide = [], rightSide = [];
			for (let i = 0; i < config.laneCount; i++) {
				if (i < mid) leftSide.push(i);
				else rightSide.push(i);
			}
			
			let l = leftSide[Math.floor(Math.random() * leftSide.length)];
			let r = rightSide[Math.floor(Math.random() * rightSide.length)];
			
			if (config.type === 'speed') {
				if (lastLanes.includes(l) && leftSide.length > 1) l = leftSide.find(idx => !lastLanes.includes(idx));
				if (lastLanes.includes(r) && rightSide.length > 1) r = rightSide.find(idx => !lastLanes.includes(idx));
			}
			selected.push(l, r);
		}

		// 事実：laneCountArray の要素数が config.laneCount と一致しない場合は再生成
		if (laneCountArray.length !== config.laneCount) {
			laneCountArray = new Array(config.laneCount).fill(0);
		}

		laneCountArray = laneCountArray.map((count, idx) => selected.includes(idx) ? count + 1 : 0);
		lastLanes = [...selected];

		const stepMS = 60000 / config.bpm / config.res;
		const stepsToTravel = Math.round(2000 / stepMS);
		const arrivalDelay = stepMS * stepsToTravel;
		const isArrivalDownBeat = (currentStep + stepsToTravel) % (config.res * 4) === 0;

		selected.forEach(laneIdx => {
			activeNotes.push({ 
				lane: laneIdx, 
				targetTime: spawnTime + arrivalDelay, 
				isBlue: isArrivalDownBeat 
			});
		});
	}

	function judge(lane) {
        const now = performance.now();
        // 事実：filter でそのレーンのノーツだけを抽出し、targetTime 順（古い順）にソートします
        const laneNotes = activeNotes
            .filter(n => n.lane === lane)
            .sort((a, b) => a.targetTime - b.targetTime);

        if (laneNotes.length === 0) return;

        // 一番手前（targetTime が最小）のノーツを対象にする
        const n = laneNotes[0];
        const target = n.targetTime + config.offset;
        const diff = now - target;
        const absDiff = Math.abs(diff);

        // 判定幅（200ms）を超えている場合は、そのノーツは無視（まだ遠すぎる）
        if (absDiff > 200) return;

        // 事実：実際に判定されたノーツを activeNotes から削除します
        const originalIndex = activeNotes.indexOf(n);
        if (originalIndex !== -1) {
            activeNotes.splice(originalIndex, 1);
        }

        // デバッグログ更新
        debugLog.unshift({ lane, diff: diff.toFixed(2), time: now });
        if (debugLog.length > 5) debugLog.pop();

        // 演出処理
        effects.push({ lane: lane, life: 1.0 });
        const isPerf = absDiff < 45;
        judgeEl.innerText = isPerf ? "PERFECT" : (absDiff < 90 ? "GREAT" : "GOOD");
        judgeEl.style.color = isPerf ? "#0ff" : "#fff";
        
        judgeEl.classList.remove('judge-bounce');
        void judgeEl.offsetWidth;
        judgeEl.classList.add('judge-bounce');
        
        combo++;
        comboEl.innerText = combo;
    }

	function updateTouchLanes(e) {
        const rect = canvas.getBoundingClientRect();
        activeTouchLanes = [false, false, false, false];
        for (let i = 0; i < e.touches.length; i++) {
            const tX = e.touches[i].clientX - rect.left;
            const tY = e.touches[i].clientY - rect.top;
            
            // 事実：新関数を使い、見た目と光る場所を完全に一致させます
            const l = getLaneFromCoords(tX, tY);
            if (l !== -1) activeTouchLanes[l] = true;
        }
    }
	
	
function update() {
        if (!isPlaying) return;
        const now = performance.now();
        
        // オートプレイが有効な時だけ計算を回す
        if (isAuto) {
            for (let i = activeNotes.length - 1; i >= 0; i--) {
                const n = activeNotes[i];
                // あなたの環境に最適化した「-8ms」の閾値を維持
                if (now >= (n.targetTime + config.offset - 8)) {
                    judge(n.lane);
                }
            }
        }

        const stepInterval = (60000 / config.bpm) / config.res;
        if (now - lastStepTime > stepInterval) {
            if (subStep % config.res === 0) playTick((subStep / config.res) % 4 === 0);
            spawnPattern(now, subStep);
            lastStepTime = now;
            subStep++;
        }
        render(now);
        
        // 事実：可視化用のマーカーを描画します
        drawVisualDebug(now); 
        
        requestAnimationFrame(update);
    }

    function drawVisualDebug(now) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
        ctx.font = "14px monospace";
        
        // 左上に現在の精密な時間を表示
        ctx.fillText(`System Time: ${now.toFixed(2)}`, 10, 150);

        debugLog.forEach((log, idx) => {
            // 直近の判定結果と、その時のズレを大きく表示
            ctx.fillStyle = Math.abs(log.diff) < 20 ? "#0ff" : "#f04";
            ctx.fillText(`Last Hit Lane ${log.lane}: ${log.diff}ms`, 10, 180 + (idx * 20));
        });

        // 判定線に「理想の0ms」を強調表示
        const judgeY = height * JUDGE_LINE_Y_RATIO;
        ctx.strokeStyle = "#f0f"; // マゼンタ色の細い線
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, judgeY);
        ctx.lineTo(width, judgeY);
        ctx.stroke();
    }
	
	function drawDebugInfo() {
        ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
        ctx.font = "12px monospace";
        ctx.textAlign = "left";
        ctx.fillText(`AutoPlay: ${isAuto ? "ON" : "OFF"}`, 10, height - 100);
        
        debugLog.forEach((log, idx) => {
            // 事実：diff が + なら遅延、 - なら早押しです。オートなら 0 に近いはずです。
            ctx.fillText(`Lane ${log.lane} | Diff: ${log.diff}ms`, 10, height - 80 + (idx * 15));
        });
    }
	

    function start() {
        if (isPlaying) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        isPlaying = true; 
        update();
    }



	// タッチ判定も laneCount に基づく
	function getLaneFromCoords(tx, ty) {
		const judgeY = height * JUDGE_LINE_Y_RATIO;
		const scale = Math.max(0, (ty - VANISHING_Y) / (judgeY - VANISHING_Y));
		const centerX = width / 2;
		const laneFullW = Math.min(width, MAX_LANE_WIDTH);
		const currentFullW = laneFullW * scale;
		const leftEdge = centerX - currentFullW / 2;
		
		const relativePos = (tx - leftEdge) / currentFullW;
		const l = Math.floor(relativePos * config.laneCount);
		return (l >= 0 && l < config.laneCount) ? l : -1;
	}





	canvas.addEventListener('touchstart', (e) => {
			if (e.cancelable) e.preventDefault();
			if (!isPlaying) start();
			
			const rect = canvas.getBoundingClientRect();

			for (let i = 0; i < e.changedTouches.length; i++) {
				const t = e.changedTouches[i];
				const tx = t.clientX - rect.left;
				const ty = t.clientY - rect.top;
				
				// 事実：高さ（ty）を考慮した判定を行い、空振りを防ぎます
				const l = getLaneFromCoords(tx, ty);
				if (l !== -1) {
					judge(l);
				}
			}
			updateTouchLanes(e);
		}, {passive: false});

    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        updateTouchLanes(e);
    }, {passive: false});

    canvas.addEventListener('touchend', (e) => {
        updateTouchLanes(e);
    });

	const KEY_CONFIGS = {
		4: { 'd': 0, 'f': 1, 'j': 2, 'k': 3 },
		5: { 'd': 0, 'f': 1, 'j': 2, 'k': 3, 'l': 4 },
		6: { 's': 0, 'd': 1, 'f': 2, 'j': 3, 'k': 4, 'l': 5 },
		7: { 's': 0, 'd': 1, 'f': 2, ' ': 3, 'j': 4, 'k': 5, 'l': 6 },
		8: { 'a': 0, 's': 1, 'd': 2, 'f': 3, 'j': 4, 'k': 5, 'l': 6, ';': 7 },
		9: { 'a': 0, 's': 1, 'd': 2, 'f': 3, ' ': 4, 'j': 5, 'k': 6, 'l': 7, ';': 8 },
		10: { 'q': 0, 'w': 1, 'e': 2, 'r': 3, 'v': 4, 'n': 5, 'u': 6, 'i': 7, 'o': 8, 'p': 9 }
	};

	window.onkeydown = (e) => {
		// スペースキーによるスクロールを防止
		if (e.key === ' ') e.preventDefault();
		
		const key = e.key.toLowerCase();
		const currentMap = KEY_CONFIGS[config.laneCount];

		// ゲーム未開始時の開始判定
		if (!isPlaying) {
			if (currentMap && currentMap[key] !== undefined) {
				start();
			} else if (key === ' ') {
				start();
			}
		}

		// 事実：現在のレーン数に対応したキーであれば判定処理を実行します
		if (currentMap && currentMap[key] !== undefined) {
			judge(currentMap[key]);
		}
	};

    document.getElementById('inp-bpm').onchange = (e) => config.bpm = parseInt(e.target.value) || 120;
    document.getElementById('inp-den').onchange = (e) => config.density = parseInt(e.target.value) || 1;
    document.getElementById('inp-spd').onchange = (e) => config.speed = parseFloat(e.target.value) || 8;
    document.getElementById('inp-off').onchange = (e) => config.offset = parseInt(e.target.value) || 0;
    document.getElementById('inp-res').onchange = (e) => config.res = parseInt(e.target.value);
    document.getElementById('inp-type').onchange = (e) => config.type = e.target.value;
	document.getElementById('inp-lane').onchange = (e) => {
    const newCount = parseInt(e.target.value);
    config.laneCount = newCount;
    
    // 事実：レーン数に依存する配列を初期化し直します
    activeTouchLanes = new Array(newCount).fill(false);
    laneCountArray = new Array(newCount).fill(0);
    lastLanes = [];
    activeNotes = []; // 以前のレーン数のノーツを消去
    combo = 0;
    comboEl.innerText = "0";
};
	
</script>
</body>
</html>
